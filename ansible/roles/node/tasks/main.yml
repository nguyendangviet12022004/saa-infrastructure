- name: Require Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: This role currently supports Ubuntu hosts only.

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Install container runtime and repository prerequisites
  ansible.builtin.apt:
    name:
      - "{{ node_containerd_package }}"
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Load Kubernetes networking modules at boot
  ansible.builtin.template:
    src: k8s-modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"

- name: Load Kubernetes networking modules now
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  changed_when: false
  loop: "{{ node_runtime_modules }}"

- name: Configure Kubernetes networking sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
    state: present
    reload: true
  loop: "{{ node_runtime_sysctls | dict2items }}"

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: node_containerd_default_config
  changed_when: false

- name: Configure containerd with systemd cgroups
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: "{{ node_containerd_config_path }}"
    mode: "0644"
  notify: Restart containerd

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes package signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v{{ node_kubernetes_minor_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Configure Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ node_kubernetes_minor_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ node_kubernetes_packages }}"
    state: present
    update_cache: true

- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ node_kubernetes_packages }}"

- name: Enable containerd and kubelet
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd
    - kubelet

- name: Apply runtime configuration before cluster setup
  ansible.builtin.meta: flush_handlers

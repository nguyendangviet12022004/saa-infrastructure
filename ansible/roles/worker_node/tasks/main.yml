- name: Require a kubeadm join command
  ansible.builtin.assert:
    that:
      - worker_node_kubeadm_join_command | length > 0
    fail_msg: Set kubeadm_join_command to the command printed by kubeadm token create --print-join-command on the control plane.

- name: Join the Kubernetes cluster
  ansible.builtin.command:
    cmd: "{{ worker_node_kubeadm_join_command }}"
    creates: /etc/kubernetes/kubelet.conf

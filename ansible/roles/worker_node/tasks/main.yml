- name: Require a kubeadm join command
  ansible.builtin.assert:
    that:
      - >-
        (worker_node_kubeadm_join_command | length > 0) or
        (hostvars[groups['master_node'][0]].master_node_kubeadm_join_command | default('') | length > 0)
    fail_msg: The master play must run first so it can generate a worker join command, or set worker_node_kubeadm_join_command explicitly.

- name: Join the Kubernetes cluster
  ansible.builtin.command:
    cmd: >-
      {{ worker_node_kubeadm_join_command if worker_node_kubeadm_join_command | length > 0
         else hostvars[groups['master_node'][0]].master_node_kubeadm_join_command }}
    creates: /etc/kubernetes/kubelet.conf

---
- name: Require Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: This role currently supports Ubuntu hosts only.

- name: Install MySQL packages
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start MySQL
  ansible.builtin.service:
    name: "{{ mysql_service_name }}"
    state: started
    enabled: true
